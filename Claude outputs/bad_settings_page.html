<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ProjFlow — Settings (deliberately bad)</title>
<style>
  body {
    margin: 0;
    background: #F5F5F5;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
    color: #555555;
  }
  .page {
    max-width: 640px;
    margin: 0 auto;
    padding: 24px;
  }
  /* Header: same size/weight as body text — no hierarchy signal */
  .header {
    font-size: 14px;
    font-weight: normal;
    color: #555555;
    margin-bottom: 4px;
  }
  /* Every row and every "section" uses the identical 4px gap —
     no visual grouping, so sections bleed into each other */
  .row {
    margin-bottom: 4px;
    display: flex;
    align-items: center;
  }
  .label {
    color: #555555;
    font-size: 14px;
  }
  /* Alignment chaos: label-above, label-left, label-right, all mixed */
  .row.label-above { flex-direction: column; align-items: flex-start; }
  .row.label-left .label { width: 140px; flex-shrink: 0; }
  .row.label-right { flex-direction: row-reverse; justify-content: flex-end; }
  .row.label-right .label { margin-left: 8px; }

  input {
    border: 1px solid #cccccc;
    padding: 6px 8px;
    font-size: 14px;
    color: #333333;
    background: #ffffff;
  }
  /* Inconsistent widths with no functional reason */
  .w-email { width: 180px; }
  .w-name { width: 320px; }
  .w-company { width: 90px; }
  .w-tz { width: 150px; }

  /* Required asterisk blends into everything else */
  .req {
    color: #999999;
  }

  /* Disabled and active fields look identical */
  input:disabled {
    background: #ffffff;
    color: #333333;
    border: 1px solid #cccccc;
  }

  .toggle-row { justify-content: space-between; }

  /* Save button: barely visible against the page background */
  .btn-save {
    background: #E8E8E8;
    color: #FFFFFF;
    border: none;
    padding: 8px 18px;
    font-size: 14px;
    cursor: pointer;
  }

  /* Delete button: loud, bold, and right next to billing with no separation */
  .btn-delete {
    background: #E11D1D;
    color: #ffffff;
    border: none;
    font-weight: bold;
    padding: 10px 20px;
    font-size: 15px;
    cursor: pointer;
  }

  .danger-label {
    color: #555555;
    font-size: 14px;
    margin-bottom: 4px;
  }
</style>
</head>
<body>
<div class="page">

  <div class="header">Settings</div>

  <!-- Profile section -->
  <div class="row label-above">
    <span class="label">Display name</span>
    <input class="w-name" type="text" value="Chahat Beniwal">
  </div>
  <div class="row label-left">
    <span class="label">Email</span>
    <input class="w-email" type="text" value="chahat@smartsense.com">
  </div>
  <div class="row label-right">
    <span class="label">Company name</span>
    <input class="w-company" type="text" value="SSS">
  </div>
  <div class="row label-above">
    <span class="label">Time zone</span>
    <input class="w-tz" type="text" value="IST (GMT+5:30)">
  </div>
  <div class="row label-above">
    <span class="label">Default currency <span class="req">*</span></span>
    <input class="w-company" type="text" value="INR">
  </div>

  <!-- Notifications section: no gap or header separating it from Profile above -->
  <div class="row toggle-row">
    <span class="label">Email notifications</span>
    <input type="checkbox" checked>
  </div>
  <div class="row toggle-row">
    <span class="label">SMS alerts</span>
    <input type="checkbox">
  </div>
  <div class="row toggle-row">
    <span class="label">Weekly digest</span>
    <input type="checkbox" checked>
  </div>

  <!-- Billing section: again, no header, no separation -->
  <div class="row label-left">
    <span class="label">Plan</span>
    <input class="w-name" type="text" value="Pro — ₹1,499/mo" disabled>
  </div>
  <div class="row label-above">
    <span class="label">Card on file</span>
    <input class="w-email" type="text" value="**** **** **** 4471">
  </div>

  <!-- Team permissions -->
  <div class="row label-left">
    <span class="label">Default role for new members</span>
    <input class="w-company" type="text" value="Editor">
  </div>

  <!-- Save button, barely visible -->
  <div class="row">
    <button class="btn-save">Save Changes</button>
  </div>

  <!-- Danger zone, right up against everything else, with the loudest visual weight on the page -->
  <div class="row label-above">
    <span class="danger-label">Danger Zone</span>
    <button class="btn-delete">Delete Workspace</button>
  </div>

</div>
</body>
</html>
